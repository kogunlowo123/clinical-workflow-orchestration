replicaCount: 3

image:
  repository: ghcr.io/kogunlowo123/clinical-workflow-orchestration
  tag: ""  # defaults to .Chart.AppVersion
  digest: ""  # set to pin an immutable sha256 digest; takes precedence over tag
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: clinical-workflow-orchestration
  # Cloud workload identity bindings from Terraform, e.g.
  #   azure.workload.identity/client-id (AKS Workload ID)
  #   eks.amazonaws.com/role-arn (AWS IRSA)
  #   iam.gke.io/gcp-service-account (GKE Workload Identity)
  annotations: {}

podLabels: {}

# Deployment-specific values marked REQUIRED have no default; the chart
# refuses to render until they are set (helm install --values <env>.yaml).
cwo:
  environment: production
  publicUrl: ""  # REQUIRED: public HTTPS URL, advertised in the A2A Agent Card
  agentId: ""  # REQUIRED: SPIFFE id of this orchestrator in the identity fabric
  logLevel: INFO
  otlpEndpoint: ""  # optional OTLP gRPC endpoint
  fhir:
    baseUrl: ""  # REQUIRED: EHR FHIR R4 base URL (https)
    smartClientId: ""  # REQUIRED: backend-services client id registered with the EHR
    smartKeyId: ""  # REQUIRED: kid of the registered public key
    smartAlgorithm: RS384  # RS384 or ES384
    smartTokenUrl: ""  # optional; discovered from .well-known/smart-configuration
    identifierSystem: ""  # REQUIRED: URI namespace for CarePlan/Task identifiers
  users:
    issuer: ""  # REQUIRED: enterprise OIDC issuer for clinicians and staff
    audience: ""  # REQUIRED: audience of clinicians' access tokens
    jwksUrl: ""  # REQUIRED
    rolesClaim: roles
    fhirUserClaim: fhirUser
  identityFabric:
    url: ""  # REQUIRED: agent identity fabric base URL
    tokenAudience: identity-fabric  # audience of the projected workload token
  models:
    azureOpenAI:
      endpoint: ""  # REQUIRED: https://<resource>.openai.azure.com
      deployment: ""  # REQUIRED: deployment name
      model: ""  # REQUIRED: model behind the deployment (for cost and audit)
      region: ""  # REQUIRED
      inputCostPerMtok: ""  # REQUIRED: contracted USD per million input tokens
      outputCostPerMtok: ""  # REQUIRED
    selfHosted:
      url: ""  # REQUIRED: in-cluster OpenAI-compatible endpoint (vLLM)
      model: ""  # REQUIRED
  execution:
    maxRevisions: 3
    leaseSeconds: 300
    sweepIntervalSeconds: 30
    maxAutoRetries: 3
    retryBaseSeconds: 30
    runnerConcurrency: 8

# Secrets are created by the platform secret operator (External Secrets,
# Secrets Store CSI) from the cloud secret manager provisioned by Terraform.
secrets:
  # Secret holding key DATABASE_URL (postgresql+asyncpg://...).
  database: clinical-workflow-orchestration-database
  # Secret holding one Ed25519 PEM: signs sign-off attestations and the audit chain.
  signingKey: clinical-workflow-orchestration-signing-key
  signingKeyFile: ""  # REQUIRED: file name within secrets.signingKey, e.g. cwo-2026-10.pem
  # Secret holding smart.pem, the private key registered with the EHR.
  smartKey: clinical-workflow-orchestration-smart-key
  # Secret holding AZURE_OPENAI_API_KEY.
  modelKeys: clinical-workflow-orchestration-model-keys

audit:
  storageClassName: ""
  size: 20Gi

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  host: ""  # required when ingress.enabled
  tlsSecret: clinical-workflow-orchestration-tls
  annotations: {}

resources:
  requests:
    cpu: 250m
    memory: 384Mi
  limits:
    cpu: "1"
    memory: 768Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  minAvailable: 2

networkPolicy:
  enabled: true
  # Namespaces whose pods (agents, gateways) may call the orchestrator.
  allowedNamespaceLabels:
    agent-platform/member: "true"
  monitoringNamespaceLabels:
    kubernetes.io/metadata.name: observability
  ingressNamespaceLabels:
    kubernetes.io/metadata.name: ingress-nginx
  # Port of the in-cluster model server (vLLM) reached on egress.
  modelServerPort: 8000

serviceMonitor:
  enabled: false
  interval: 30s

nodeSelector: {}
tolerations: []
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
