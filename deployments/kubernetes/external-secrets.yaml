# Syncs orchestrator secrets from the cloud secret manager provisioned by
# deployments/terraform/<cloud> (Azure Key Vault in the reference deployment).
# Requires the External Secrets Operator and a ClusterSecretStore named
# "platform-secrets" bound to that secret manager. Remote keys match the
# names Terraform creates or the key-generation runbook writes.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: clinical-workflow-orchestration-database
  namespace: clinical-workflow
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: clinical-workflow-orchestration-database
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: clinical-workflow-orchestration-database-url
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: clinical-workflow-orchestration-signing-key
  namespace: clinical-workflow
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: clinical-workflow-orchestration-signing-key
    creationPolicy: Owner
  dataFrom:
    - find:
        name:
          regexp: "^clinical-workflow-orchestration-signing-key-"
      rewrite:
        - regexp:
            source: "^clinical-workflow-orchestration-signing-key-(.*)$"
            target: "$1.pem"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: clinical-workflow-orchestration-smart-key
  namespace: clinical-workflow
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: clinical-workflow-orchestration-smart-key
    creationPolicy: Owner
  data:
    - secretKey: smart.pem
      remoteRef:
        key: clinical-workflow-orchestration-smart-key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: clinical-workflow-orchestration-model-keys
  namespace: clinical-workflow
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: clinical-workflow-orchestration-model-keys
    creationPolicy: Owner
  data:
    - secretKey: AZURE_OPENAI_API_KEY
      remoteRef:
        key: clinical-workflow-orchestration-azure-openai-key
